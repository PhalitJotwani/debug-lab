name: debug-lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - tasks/01-cpp-heap-overflow-asan
          - tasks/02-python-perf-regression
          - tasks/03-java-race-condition
          - tasks/04-git-bisect-regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify ${{ matrix.task }}
        run: make verify TASK=${{ matrix.task }}

  verify-all:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify all tasks
        run: make verify
